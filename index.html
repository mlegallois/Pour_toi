<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Une lettre pour toi...</title>
    <style>
        body {
            background-color: #ffe4e6;
            color: #881337;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        /* --- ÉCRAN DE L'ENVELOPPE --- */
        #envelope-container {
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        #envelope-container:hover {
            transform: scale(1.05);
        }
        .instruction {
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .envelope {
            font-size: 5rem;
            background: white;
            padding: 30px 50px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(136, 19, 55, 0.15);
            display: inline-block;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: deselect; translateY(-10px); }
        }

        /* --- ÉCRAN DE LA QUESTION (caché au début) --- */
        #question-container {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease-in;
            max-width: 90%;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 2rem;
        }
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            position: relative;
            height: 100px;
        }
        .btn {
            padding: 12px 28px;
            font-size: 1.1rem;
            border-radius: 9999px;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }
        #yesBtn {
            background-color: #e11d48;
            color: white;
            z-index: 10;
        }
        #noBtn {
            background-color: #cbd5e1;
            color: #475569;
            position: relative;
            transition: 0.1s ease-out;
        }
        #responseMessage {
            margin-top: 30px;
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Étape 1 : L'enveloppe -->
    <div id="envelope-container" onclick="openEnvelope()">
        <div class="instruction">Tu as reçu un message, clique pour l'ouvrir 💌</div>
        <div class="envelope">✉️</div>
    </div>

    <!-- Étape 2 : La question et les boutons (cachés au départ) -->
    <div id="question-container">
        <h1 id="question">Est ce que tu veux manger un mont d'or ce soir ? ❤️ </br> Tu ne peux pas refuser 😜</h1>
        
        <div class="buttons" id="buttonArea">
            <button class="btn" id="yesBtn" onclick="sendResponse('Oui')">Oui ! 🥰</button>
            <button class="btn" id="noBtn" ontouchstart="moveButton()" onmouseover="moveButton()" onclick="moveButton()">Non 😢</button>
        </div>

        <div id="responseMessage"></div>
    </div>

    <script>
        // Fonction pour ouvrir l'enveloppe
        function openEnvelope() {
            const envContainer = document.getElementById('envelope-container');
            const qContainer = document.getElementById('question-container');

            // Disparition de l'enveloppe
            envContainer.style.display = 'none';

            // Apparition de la question en fondu
            qContainer.style.display = 'block';
            setTimeout(() => {
                qContainer.style.opacity = '1';
            }, 50);
        }

        // Fonction corrigée pour faire fuir le bouton "Non" sur iPad et PC
        const noBtn = document.getElementById('noBtn');
        
        function moveButton(event) {
            // Empêche le comportement paratique par défaut du clic tactile
            if (event) event.preventDefault();

            // Calcule une position aléatoire dans l'écran
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 150);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        // Fonction d'envoi du mail (pensez à remplacer YOUR_FORMSPREE_ID)
        function sendResponse(answer) {
            document.getElementById('buttonArea').style.display = 'none';
            document.getElementById('question').style.display = 'none';
            document.getElementById('responseMessage').innerText = "YAY ! J'ai hâte ! ❤️";

            fetch('https://formspree.io/f/YOUR_FORMSPREE_ID', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ reponse: answer })
            }).catch(error => console.error('Erreur', error));
        }
    </script>
</body>
</html>
