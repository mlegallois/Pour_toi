<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Une lettre pour toi...</title>
    <style>
        body {
            background-color: #ffe4e6;
            color: #881337;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        /* --- ÉCRAN DE L'ENVELOPPE --- */
        #envelope-container {
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        #envelope-container:hover {
            transform: scale(1.05);
        }
        .instruction {
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .envelope {
            font-size: 5rem;
            background: white;
            padding: 30px 50px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(136, 19, 55, 0.15);
            display: inline-block;
        }

        /* --- ÉCRAN DE LA QUESTION (caché au début) --- */
        #question-container {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease-in;
            max-width: 90%;
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 2rem;
            line-height: 1.4;
        }
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            position: relative;
            height: 100px;
        }
        .btn {
            padding: 12px 28px;
            font-size: 1.1rem;
            border-radius: 9999px;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }
        #yesBtn {
            background-color: #e11d48;
            color: white;
            z-index: 10;
        }
        #noBtn {
            background-color: #cbd5e1;
            color: #475569;
            position: relative;
            transition: 0.1s ease-out;
        }
        #responseMessage {
            margin-top: 30px;
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Étape 1 : L'enveloppe -->
    <div id="envelope-container" onclick="openEnvelope()">
        <div class="instruction">Tu auras reçu un message, clique pour l'ouvrir 💌</div>
        <div class="envelope">✉️</div>
    </div>

    <!-- Étape 2 : La question et le formulaire Formspree -->
    <div id="question-container">
        <h1 id="question">Est ce que tu veux manger un mont d'or ce soir ? ❤️ <br> Tu ne peux pas refuser 😜</h1>
        
        <form id="my-form">
            <input type="hidden" name="reponse" id="reponseInput" value="Oui">
            
            <div class="buttons" id="buttonArea">
                <button type="submit" class="btn" id="yesBtn" data-fs-submit-btn onclick="setYes()">Oui ! 🥰</button>
                <button type="button" class="btn" id="noBtn" ontouchstart="moveButton(event)" onmouseover="moveButton(event)" onclick="moveButton(event)">Non 😢</button>
            </div>
        </form>

        <div id="responseMessage" data-fs-success></div>
    </div>

    <!-- Scripts -->
    <script>
        function openEnvelope() {
            document.getElementById('envelope-container').style.display = 'none';
            const qContainer = document.getElementById('question-container');
            qContainer.style.display = 'block';
            setTimeout(() => { qContainer.style.opacity = '1'; }, 50);
        }

        function setYes() {
            document.getElementById('reponseInput').value = "Oui ! Elle a dit OUI pour le Mont d'Or 🫕❤️";
            setTimeout(() => {
                document.getElementById('buttonArea').style.display = 'none';
                document.getElementById('question').style.display = 'none';
                document.getElementById('responseMessage').innerText = "OUIIIII ! je prépare tout ça en rentrant ! 🫕❤️";
            }, 300);
        }

        const noBtn = document.getElementById('noBtn');
        function moveButton(event) {
            if (event) event.preventDefault();
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 150);
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }
    </script>
    
    <script>
        window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
        formspree('initForm', { formElement: '#my-form', formId: 'moeelqyv' });
    </script>
    <script src="https://unpkg.com/@formspree/ajax@1" defer></script>
</body>
</html>
